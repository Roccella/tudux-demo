  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 99999;
      transition: opacity 0.2s ease;
    }
    #boot-splash .boot-spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      animation: bootSpin 0.8s linear infinite;
      will-change: transform;
    }
    @keyframes bootSpin {
      to { transform: rotate(360deg); }
    }
    #boot-splash.boot-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <script type="module" crossorigin src="/tudux-demo/assets/index-CcKHpsdn.js"></script>
  <link rel="stylesheet" crossorigin href="/tudux-demo/assets/index-B_7wy9IG.css">
</head>
<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-spinner"></div>
  </div>
  <div id="root"></div>
  <script>
    // Auto-reload on stale module errors (SW cache out of sync with deployed assets)
    window.addEventListener('error', function(e) {
      var msg = e.message || '';
      if (msg.indexOf('Importing a module script failed') !== -1 ||
          msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('error loading dynamically imported module') !== -1) {
        var key = 'tudux-stale-reload';
        try {
          var last = sessionStorage.getItem(key);
          var now = Date.now();
          if (!last || now - parseInt(last, 10) > 30000) {
            sessionStorage.setItem(key, String(now));
            location.reload();
          }
        } catch(x) {}
      }
    });
  </script>
</body>
</html>
